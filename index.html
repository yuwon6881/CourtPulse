<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CourtPulse — Badminton Session, Fee Split &amp; Tier Manager</title>
    <meta name="description" content="Organize badminton sessions, generate one-tap group chat RSVP links with cached player recognition, split court fees with automatic next-week balance requests, and track singles/doubles leaderboards and tier lists." />
    <meta property="og:title" content="CourtPulse — Badminton Session, Fee Split &amp; Tier Manager" />
    <meta property="og:description" content="Organize badminton sessions, generate one-tap group chat RSVP links with cached player recognition, split court fees with automatic next-week balance requests, and track singles/doubles leaderboards and tier lists." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CourtPulse" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&amp;family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <style>
      html {
        background-color: #f8fafc;
        color-scheme: light;
      }
      html.dark {
        background-color: #050505;
        color-scheme: dark;
      }
    </style>
    <script>
      (function () {
        var key = 'courtpulse_theme_v1';
        var mode = null;
        try {
          var saved = window.localStorage.getItem(key);
          if (saved === 'dark' || saved === 'light') mode = saved;
        } catch (e) {}
        if (!mode) {
          try {
            var parts = document.cookie ? document.cookie.split(';') : [];
            for (var i = 0; i < parts.length; i++) {
              var part = parts[i].trim();
              if (part.indexOf(key + '=') === 0) {
                var val = decodeURIComponent(part.slice(key.length + 1)).trim();
                if (val === 'dark' || val === 'light') {
                  mode = val;
                  break;
                }
              }
            }
            if (mode) {
              try {
                window.localStorage.setItem(key, mode);
              } catch (e) {}
            }
          } catch (e) {}
        }
        var isDark = mode === 'dark';
        var resolved = isDark ? 'dark' : 'light';
        var root = document.documentElement;
        root.classList.toggle('dark', isDark);
        root.dataset.theme = resolved;
        root.style.colorScheme = resolved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', isDark ? '#050505' : '#059669');
        var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusBar) statusBar.setAttribute('content', isDark ? 'black-translucent' : 'default');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
